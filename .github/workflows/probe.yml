name: probe-tide-api
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import os,urllib.parse,urllib.request
          k=os.environ['K'].strip(); k=urllib.parse.unquote(k) if '%' in k else k
          B='https://apis.data.go.kr/1192136/'
          tests=[('extrmTideLvl/GetExtrmTideLvlApiService',{'obsCode':'DT_0005','reqDate':'2023'}),
                 ('extrmTideLvl/GetExtrmTideLvlApiService',{'obsCode':'DT_0005','reqDate':'202301'}),
                 ('extrmTideLvl/GetExtrmTideLvlApiService',{'obsCode':'DT_0005','year':'2023'}),
                 ('deviationCal/GetDeviationCalApiService',{'obsCode':'DT_0005','reqDate':'202309'}),
                 ('deviationCal/GetDeviationCalApiService',{'obsCode':'DT_0005','reqDate':'2023'})]
          for ep,p in tests:
            q=dict(serviceKey=k,type='json',numOfRows='3',pageNo='1',**p)
            try: t=urllib.request.urlopen(B+ep+'?'+urllib.parse.urlencode(q),timeout=30).read().decode('utf-8','replace')
            except Exception as e: t='ERR '+str(e)
            print('==',ep,p); print(t[:1500].replace(k,'***'))
          PY
